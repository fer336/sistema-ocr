<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-label="Arquitectura de Sanitini — Swarm con Traefik, backend, frontend, Postgres y MinIO remotos">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1f28"/>
      <stop offset="1" stop-color="#2a2a37"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#54546d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" rx="20" fill="url(#bg2)" stroke="#363646" stroke-width="2"/>

  <!-- Título -->
  <text x="40" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600" fill="#dcd7ba">Arquitectura</text>
  <text x="40" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#7e9cd8">Producción: Docker Swarm (Portainer) detrás de Traefik — solo 2 servicios: backend y frontend</text>

  <!-- Cliente -->
  <rect x="40" y="130" width="190" height="86" rx="12" fill="#2a2a37" stroke="#363646" stroke-width="2"/>
  <text x="135" y="162" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#dcd7ba">Navegador</text>
  <text x="135" y="184" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7e9cd8">cliente / WhatsApp</text>
  <text x="135" y="202" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#54546d">sesión Google OAuth</text>

  <!-- Traefik -->
  <rect x="420" y="112" width="290" height="122" rx="12" fill="#232333" stroke="#1d6ff2" stroke-width="2"/>
  <text x="565" y="144" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#dcd7ba">Traefik · proxy</text>
  <text x="565" y="170" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7e9cd8">/api · /s/* · /health · /version → backend</text>
  <text x="565" y="190" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7e9cd8">resto (catch-all) → frontend</text>
  <text x="565" y="216" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#54546d">network_public · TLS letsencrypt</text>

  <!-- Flechas cliente -> traefik -->
  <line x1="230" y1="173" x2="418" y2="173" stroke="#54546d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Frontend -->
  <rect x="150" y="330" width="260" height="100" rx="12" fill="#2a2a37" stroke="#363646" stroke-width="2"/>
  <text x="280" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#dcd7ba">Frontend · Vite + React 19</text>
  <text x="280" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7e9cd8">build estático · TS + Tailwind</text>
  <text x="280" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#54546d">VITE_* horneados en el build (públicos)</text>

  <!-- Backend -->
  <rect x="690" y="330" width="300" height="100" rx="12" fill="#2a2a37" stroke="#363646" stroke-width="2"/>
  <text x="840" y="362" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#dcd7ba">Backend · FastAPI (Python 3.12)</text>
  <text x="840" y="386" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#7e9cd8">worker OCR embebido · cola de proceso</text>
  <text x="840" y="406" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#54546d">migraciones Alembic en el entrypoint</text>

  <!-- Flechas traefik -> frontend / backend -->
  <path d="M 470 234 L 280 300" fill="none" stroke="#54546d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 660 234 L 840 300" fill="none" stroke="#54546d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="180" y="470" width="240" height="66" rx="12" fill="#2a2a37" stroke="#98bb6c" stroke-width="2"/>
  <text x="300" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#dcd7ba">PostgreSQL</text>
  <text x="300" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7e9cd8">remoto — no lo despliega este stack</text>

  <!-- MinIO -->
  <rect x="720" y="470" width="240" height="66" rx="12" fill="#2a2a37" stroke="#98bb6c" stroke-width="2"/>
  <text x="840" y="498" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#dcd7ba">MinIO · S3</text>
  <text x="840" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7e9cd8">remoto — PDFs e imágenes optimizadas</text>

  <!-- Flechas backend -> db / minio -->
  <path d="M 700 400 L 340 462" fill="none" stroke="#54546d" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 820 430 L 820 468" fill="none" stroke="#54546d" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nota 1 réplica -->
  <rect x="420" y="470" width="290" height="66" rx="12" fill="none" stroke="#ff9e3b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="565" y="496" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#ff9e3b">⚠ backend corre con EXACTAMENTE 1 réplica</text>
  <text x="565" y="518" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#7e9cd8">escalarlo duplicaría el consumidor de la cola OCR</text>
</svg>