<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Remitos</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Aplica el tema elegido ANTES del primer paint, si no hay uno guardado
      // sigue el sistema operativo (el CSS ya cubre ese caso solo). Evita el
      // flash de tema incorrecto que se vería si esto se hiciera en React.
      (function () {
        try {
          var stored = localStorage.getItem("sanitini.theme");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch {
          // localStorage deshabilitado: se sigue con el tema del sistema.
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
