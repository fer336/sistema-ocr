standard:
  name: infrastructure-deployment-standard
  version: "2.1.0"

project:
  org: fer336
  name: remitos
  snake: remitos
  track: app
  profile: A

registry:
  host: ghcr.io
  image_base: ghcr.io/fer336/remitos
  immutable_tags: true
  platforms: [linux/amd64]

runtime:
  manager: portainer
  trigger: webhook

config:
  secret_name: remitos_env
  secret_path: /run/secrets/remitos_env
  dev_file: .env

health:
  url: "https://santini.serviciospinamar.com/health"
  health_path: /health
  version_path: /version
  retries: 10
  interval_seconds: 15

migrations:
  # Perfil A, réplica única de `backend`: corren en el arranque del
  # contenedor, antes de servir tráfico (entrypoint.sh). Ya no son
  # condicionales por RUN_MIGRATIONS -- no existe un servicio "worker"
  # aparte con el que puedan pisarse (ver deviations más abajo).
  strategy: entrypoint

app:
  tests: required
  lockfile: package-lock.json

# Solo dos servicios de Swarm. Postgres/MinIO son infraestructura remota ya
# existente (no los levanta este stack) y el worker de OCR corre embebido
# en el contenedor de `backend` -- ver docs/DEVIATIONS.md.
services:
  - { name: backend,  image: ghcr.io/fer336/remitos-backend,  needs_secret: true, stateful: false }
  - { name: frontend, image: ghcr.io/fer336/remitos-frontend, needs_secret: false, stateful: false }

deviations:
  - postgres-minio-remote-not-self-hosted
  - ocr-worker-embedded-in-backend
